# Builds signed APKs for every change on main and publishes them as the
# rolling "latest" GitHub release, so anyone can install the newest build
# from a phone: https://github.com/JimeaVV/nlcn/releases/tag/latest
name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

env:
  # Public fingerprint of the OptiFit release certificate. The build fails if
  # an APK is signed with anything else (for example the debug key).
  RELEASE_CERT_SHA256: e3b83ac4fe9118e476fd0cbe55b475ca4cb64879c67ffa168bd60f7a423c7efb

jobs:
  apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing; see docs/QUA_TRINH_THUC_HIEN.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      - name: Build APKs (one per CPU type)
        run: |
          flutter pub get
          # Higher than local builds, so each release can update the last one.
          flutter build apk --release --split-per-abi \
            --build-number $((100 + GITHUB_RUN_NUMBER))

      - name: Check the signature and name the files
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          short=${GITHUB_SHA::7}
          mkdir dist
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            digest=$("$apksigner" verify --print-certs "$apk" \
              | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            if [ "$digest" != "$RELEASE_CERT_SHA256" ]; then
              echo "::error::$apk is not signed with the OptiFit release key ($digest)."
              exit 1
            fi
            abi=$(basename "$apk" | sed 's/^app-\(.*\)-release\.apk$/\1/')
            cp "$apk" "dist/OptiFit-$short-$abi.apk"
          done
          ls -lh dist

      - name: Publish the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "OptiFit – bản mới nhất từ main (${GITHUB_SHA::7})" \
            --notes "Bản build tự động sau mỗi lần gộp vào main.

          **Tải file nào?** Hầu hết điện thoại hiện nay: \`OptiFit-…-arm64-v8a.apk\`.
          Điện thoại rất cũ (32-bit): \`…-armeabi-v7a.apk\`. Máy ảo trên PC: \`…-x86_64.apk\`.

          Mọi bản đều ký bằng cùng một khóa nên cài đè được, dữ liệu được giữ nguyên.
          Commit: ${GITHUB_SHA}"
