# Runs on every pull request into main and on every push to main.
# A pull request should only be merged when all jobs are green.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the version the team develops with.
          flutter-version: 3.44.4
          channel: stable
          cache: true

      # The database tests open SQLite through sqflite_common_ffi.
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install packages
        run: flutter pub get

      - name: Generated translations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n || {
            echo "::error::lib/l10n is out of date. Run 'flutter gen-l10n' and commit the result."
            exit 1
          }

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  data:
    name: Nutrition data check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fails on wrong codes, implausible values or missing sources.
      # Empty cells are allowed until the data is complete (no --strict).
      - name: Check assets/data/vn_food
        run: python tool/check_vn_food.py
