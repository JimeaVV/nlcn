name: optifit
description: Offline meal, workout and Progressive Overload recommendations for Android.
publish_to: "none"

version: 1.2.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  image_picker: ^1.2.4
  camera: ^0.12.1
  tflite_flutter: ^0.12.1
  image: ^4.12.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  home_widget: ^0.10.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/recommendations.json
    - assets/data/vn_food/
    - assets/models/
    - assets/brand/
  shaders:
    - shaders/scan_sweep.frag
